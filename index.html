<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دعوة زفاف أحمد وهالة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Mrs+Saint+Delafield&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: a 1:2 portrait stage. Envelope layers sit over a burgundy floral scene; an arched card rises from inside and its text reveals in sequence. */
:root{
  --wine:#4d1520;
  --wine-deep:#2e0c13;
  --paper:#ece3d6;
  --paper-edge:#cdb7a0;
  --ink:#5b1a24;
  --gold:#c79a58;
  --env:#d8cbba;
  --backdrop:#1a0a0e;
  --f-ar:'Amiri','Noto Naskh Arabic',serif;
  --f-ruq:'Aref Ruqaa','Amiri',serif;
  --f-script:'Mrs Saint Delafield','Snell Roundhand',cursive;
  --f-small:'Cormorant Garamond',Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--backdrop);color:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:var(--f-ar)}
.stage{position:relative;height:min(100%,200vw);aspect-ratio:1/2;container-type:size;overflow:hidden;background:var(--wine);direction:rtl;user-select:none;-webkit-tap-highlight-color:transparent}
@media (min-width:600px){.stage{box-shadow:0 30px 80px rgba(0,0,0,.6)}}

/* scene */
.scene{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease .6s}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.bgfill{position:absolute;inset:0;background:
  radial-gradient(120% 70% at 50% 40%,#6a2230 0%,var(--wine) 55%,var(--wine-deep) 100%)}
.card{position:absolute;inset:0;transform:translateY(7%) scale(.92);transform-origin:50% 60%;transition:transform 2.2s cubic-bezier(.2,.7,.2,1) .2s}
.flora{opacity:0;transition:opacity 1.4s ease}
.stage.s-open .scene{opacity:1}
.stage.s-card .card{transform:none}
.stage.s-card .flora{opacity:1}

/* butterflies */
.bf{transform-box:fill-box;transform-origin:center;animation:flit 3.2s ease-in-out infinite}
.bf .w{transform-box:fill-box;transform-origin:50% 50%;animation:flap .9s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleX(.45)}}
@keyframes flit{50%{transform:translate(2px,-3px) rotate(6deg)}}

/* envelope */
.env{position:absolute;inset:0;z-index:5;pointer-events:none}
.f{position:absolute;inset:0;filter:drop-shadow(0 3px 7px rgba(60,35,20,.35));transition:transform 1.5s cubic-bezier(.65,0,.25,1)}
.fl{position:absolute;inset:0;background:var(--lace),linear-gradient(160deg,#e3d8c8,#d2c4b1);background-size:128px,auto}
.f-top{perspective:1400px;z-index:4;transition:none}
.f-top .fl{transform-origin:50% 0;transition:transform 1.6s cubic-bezier(.6,0,.3,1);backface-visibility:hidden;clip-path:polygon(0 0,100% 0,50% 46%)}
.f-top .fl::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(120,95,70,.12))}
.f-l{z-index:2}.f-l .fl{clip-path:polygon(0 0,50% 46%,0 100%)}
.f-r{z-index:2}.f-r .fl{clip-path:polygon(100% 0,50% 46%,100% 100%)}
.f-b{z-index:1}.f-b .fl{clip-path:polygon(0 100%,50% 46%,100% 100%)}
.f-b .tab{position:absolute;left:50%;top:50.5%;width:20%;height:9%;transform:translateX(-50%);border-radius:14% 14% 0 0/60% 60% 0 0;background:linear-gradient(#e6dccd,#d7cab8);box-shadow:0 0 0 1px rgba(255,255,255,.35) inset}
.stage.s-flaps .f-top .fl{transform:rotateX(-178deg) translateY(-4%)}
.stage.s-sides .f-l{transform:translateX(-102%)}
.stage.s-sides .f-r{transform:translateX(102%)}
.stage.s-sides .f-b{transform:translateY(102%);transition-delay:.15s}
.stage.s-gone .env{display:none}

/* wax seal */
.seal{position:absolute;left:50%;top:46%;width:30%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:8;cursor:pointer;pointer-events:auto;border:0;background:none;padding:0;transition:transform .9s ease,opacity .7s ease;filter:drop-shadow(0 6px 8px rgba(70,40,10,.45))}
.seal:focus-visible{outline:2px solid #fff;outline-offset:6px;border-radius:50%}
.seal svg{width:100%;height:100%;display:block;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.04)}}
.stage.s-seal .seal{transform:translate(-50%,-50%) scale(1.25) rotate(8deg);opacity:0;pointer-events:none}

/* content */
.logo{position:absolute;left:50%;top:36cqh;width:21cqw;transform:translate(-50%,-50%) scale(1);z-index:3;transition:top 1.6s cubic-bezier(.6,0,.2,1),width 1.6s cubic-bezier(.6,0,.2,1);opacity:0}
.logo svg{width:100%;height:auto;display:block;overflow:visible}
.logo path{fill:none;stroke:var(--ink);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.logo .dot{fill:var(--ink);stroke:none;opacity:0;transition:opacity .6s ease 1.6s}
.stage.s-logo .logo{opacity:1}
.stage.s-logo .logo path{animation:draw 2.4s ease forwards}
.stage.s-logo .logo .dot{opacity:1}
@keyframes draw{to{stroke-dashoffset:0}}
.stage.s-final .logo{top:17.5cqh;width:11cqw}

.intro{position:absolute;left:0;right:0;z-index:3;text-align:center;transition:opacity 1.1s ease,filter 1.1s ease}
.intro.names{top:46cqh;font-family:var(--f-script);font-size:17cqw;line-height:1;color:var(--ink);white-space:nowrap}
.intro.date{top:60cqh;font-size:5.2cqw;font-family:var(--f-ruq);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:3cqw;direction:rtl}
.intro.date i{display:block;width:24cqw;height:1px;background:var(--ink);opacity:.7}
.rv{opacity:0;filter:blur(7px);transform:translateY(1.2cqh);transition:opacity 1.3s ease,filter 1.3s ease,transform 1.3s ease}
.rv.on{opacity:1;filter:none;transform:none}
.stage.s-final .intro{opacity:0!important;filter:blur(8px)!important}

.copy{position:absolute;left:15cqw;right:15cqw;top:28cqh;bottom:15cqh;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;color:var(--ink)}
.copy .t{line-height:1.25}
.t1{font-size:4.5cqw;font-weight:700}
.t2{font-size:4.3cqw;font-weight:700}
.t3{font-size:3.7cqw;font-weight:700}
.t4{font-family:var(--f-ruq);font-size:6.4cqw;letter-spacing:.5cqw;font-weight:700;display:flex;align-items:center;gap:2cqw;width:100%;justify-content:center}
.t4 b{flex:0 0 7cqw;height:1.5px;background:var(--ink);opacity:.8;border-radius:2px}
.t5{font-family:var(--f-ruq);font-size:10.5cqw;font-weight:700;line-height:1.1}
.t5 span{font-size:7cqw;margin:0 1.5cqw}
.t6{font-size:4.2cqw;font-weight:700}
.t7{font-size:4.3cqw;font-weight:700;direction:rtl}
.t8{font-size:4.4cqw;font-weight:700}
.t9{font-size:3.5cqw;font-weight:700}
.brand{position:absolute;left:0;right:0;bottom:11.4cqh;text-align:center;font-family:var(--f-small);font-size:2.1cqw;letter-spacing:.5em;color:#8a6a62;z-index:3;direction:ltr}

.hint{position:absolute;left:0;right:0;top:63cqh;text-align:center;z-index:9;font:700 3.8cqw var(--f-ar);color:#7a6048;letter-spacing:.02em;pointer-events:none;animation:pulse 2.4s ease-in-out infinite;transition:opacity .6s ease}
@keyframes pulse{50%{opacity:.45}}
.stage.s-seal .hint{opacity:0;animation:none}
.mute{position:absolute;z-index:20;top:max(2cqh,env(safe-area-inset-top,0px));left:3.5cqw;width:9cqw;height:9cqw;border-radius:50%;border:1px solid rgba(236,227,214,.45);background:rgba(46,12,19,.55);color:#ecdcc6;font-size:4cqw;line-height:1;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .8s ease;display:flex;align-items:center;justify-content:center;padding:0}
.mute.show{opacity:1;pointer-events:auto}
.mute:focus-visible{outline:2px solid #fff;outline-offset:3px}
.replay{position:absolute;z-index:20;left:50%;bottom:max(2.2cqh,env(safe-area-inset-bottom,0px));transform:translateX(-50%);border:1px solid rgba(236,227,214,.45);color:#ecdcc6;background:rgba(46,12,19,.55);backdrop-filter:blur(6px);font:700 3.4cqw var(--f-ar);padding:1.2cqh 5cqw;border-radius:99px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .8s ease}
.replay.show{opacity:1;pointer-events:auto}
.replay:hover{background:rgba(46,12,19,.8)}
.replay:focus-visible{outline:2px solid #fff;outline-offset:3px}

.stage.reset,.stage.reset *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){.stage *{transition:none!important}.bf,.bf .w{animation:none}}
</style>

</head>
<body>
<main class="stage" id="stage" aria-label="دعوة زفاف">
  <audio id="bgm" preload="auto" loop></audio>
  <div class="scene" aria-hidden="true">
    <div class="bgfill"></div>
    <svg viewBox="0 0 300 600" preserveAspectRatio="none" id="floraBack" class="flora"></svg>
    <div class="card">
      <svg viewBox="0 0 300 600" preserveAspectRatio="none">
        <defs>
          <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe7da"/><stop offset="1" stop-color="#e6dccd"/></linearGradient>
          <filter id="ps" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1b0509" flood-opacity=".5"/></filter>
        </defs>
        <path id="arch" d="M42 566 L42 152 Q42 126 64 119 Q84 112 88 94 Q95 70 122 65 Q137 62 142 50 Q150 39 158 50 Q163 62 178 65 Q205 70 212 94 Q216 112 236 119 Q258 126 258 152 L258 566 Q258 574 250 574 L50 574 Q42 574 42 566Z" fill="url(#pg)" stroke="#d8c5ae" stroke-width="2" filter="url(#ps)"/>
        <path d="M42 566 L42 152 Q42 126 64 119 Q84 112 88 94 Q95 70 122 65 Q137 62 142 50 Q150 39 158 50 Q163 62 178 65 Q205 70 212 94 Q216 112 236 119 Q258 126 258 152 L258 566 Q258 574 250 574 L50 574 Q42 574 42 566Z" fill="none" stroke="#cbb39b" stroke-width="1.1" transform="translate(150 312) scale(.93 .94) translate(-150 -312)"/>
      </svg>
    </div>
    <svg viewBox="0 0 300 600" preserveAspectRatio="none" id="floraFront" class="flora"></svg>
  </div>

  <div class="logo" id="logo" aria-hidden="true">
    <svg viewBox="0 0 100 140">
      <path pathLength="1" d="M56 14 C66 6 78 12 70 22 C64 18 56 22 58 30"/>
      <path pathLength="1" d="M58 34 C80 40 86 62 70 80 C58 94 36 100 34 118 C33 130 46 136 56 128"/>
      <path pathLength="1" d="M54 40 C32 48 30 74 44 88 C56 100 70 106 64 124"/>
      <circle class="dot" cx="60" cy="24" r="2.6"/>
    </svg>
  </div>

  <div class="intro names rv" id="iNames" aria-hidden="true">Ahmed &amp; Hala</div>
  <div class="intro date rv" id="iDate" aria-hidden="true"><span>12 ديسمبر</span><i></i><span>2026</span></div>

  <div class="copy" id="copy">
    <div class="t t1 rv">إلى من هم أغلى من الروح</div>
    <div class="t t2 rv">سروري سيبقى مختلفًا بحضوركم</div>
    <div class="t t3 rv">بكل الود والحب تشرف بدعوتكم لحضور</div>
    <div class="t t4 rv"><b></b><span>حفــل زفــاف</span><b></b></div>
    <div class="t t5 rv"><span id="gName">أحمد</span><span>و</span><span id="bName">هالة</span></div>
    <div class="t t6 rv">وذلك بمشيئة الله تعالى</div>
    <div class="t t7 rv"><span id="dateTxt">12 ديسمبر 2026</span> | <span id="timeTxt">الساعة 8م</span></div>
    <div class="t t8 rv" id="venue">قاعة قصر الملوك</div>
    <div class="t t9 rv">بحضوركم يتم لنا الفرح والسرور</div>
  </div>
  <div class="brand rv" id="brand">WEDDING INVITATION</div>

  <div class="env" id="env">
    <div class="f f-b"><div class="fl"></div><div class="tab"></div></div>
    <div class="f f-l"><div class="fl"></div></div>
    <div class="f f-r"><div class="fl"></div></div>
    <div class="f f-top"><div class="fl"></div></div>
    <button class="seal" id="seal" aria-label="افتح الدعوة">
      <svg viewBox="0 0 120 120">
        <defs>
          <radialGradient id="gg" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#f3d594"/><stop offset=".55" stop-color="#d4a45e"/><stop offset="1" stop-color="#a97a38"/></radialGradient>
        </defs>
        <path id="waxEdge" fill="url(#gg)" d=""/>
        <circle cx="60" cy="60" r="40" fill="none" stroke="#b5873f" stroke-width="2"/>
        <circle cx="60" cy="60" r="43" fill="none" stroke="#f6dda3" stroke-width="1" opacity=".7"/>
        <g fill="none" stroke="#9b6e2e" stroke-width="3" stroke-linecap="round">
          <path d="M60 80 C42 80 30 70 34 56 C38 44 50 46 52 56 C54 66 62 62 62 52"/>
          <path d="M60 80 C78 80 90 70 86 56 C82 44 70 46 68 56 C66 66 58 62 58 52"/>
          <path d="M32 60 C30 74 44 86 60 86 C76 86 90 74 88 60" stroke-width="2"/>
        </g>
        <g fill="#9b6e2e"><circle cx="44" cy="44" r="3"/><circle cx="76" cy="44" r="3"/></g>
      </svg>
    </button>
  </div>

  <div class="hint" id="hint">اضغط على الختم لفتح الدعوة</div>
  <button class="mute" id="mute" type="button" aria-label="كتم الصوت" aria-pressed="false">🔊</button>
  <button class="replay" id="replay" type="button">إعادة العرض</button>
</main>

<script>
(function(){
  /* ---- editable details ---- */
  var CONFIG={groom:"أحمد",bride:"هالة",latin:"Ahmed & Hala",date:"12 ديسمبر 2026",time:"الساعة 8م",venue:"قاعة قصر الملوك",tag:"WEDDING INVITATION",audio:"mp31.m4a"};
  var bgm=document.getElementById('bgm');
  bgm.src=CONFIG.audio;
  document.getElementById('gName').textContent=CONFIG.groom;
  document.getElementById('bName').textContent=CONFIG.bride;
  document.getElementById('iNames').textContent=CONFIG.latin;
  document.getElementById('dateTxt').textContent=CONFIG.date;
  document.getElementById('timeTxt').textContent=CONFIG.time;
  document.getElementById('venue').textContent=CONFIG.venue;
  document.getElementById('brand').textContent=CONFIG.tag;

  var NS="http://www.w3.org/2000/svg";
  function el(p,n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}
  function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  /* ---- embossed lace tile for the envelope ---- */
  (function(){
    function sprig(c){
      var s='';
      s+='<circle cx="0" cy="0" r="14" fill="none" stroke="'+c+'" stroke-width="1.4"/>';
      s+='<circle cx="0" cy="0" r="9" fill="none" stroke="'+c+'" stroke-width="1.2"/>';
      s+='<circle cx="0" cy="0" r="4.5" fill="none" stroke="'+c+'" stroke-width="1.2"/>';
      for(var i=0;i<6;i++){var a=i*60;s+='<ellipse cx="0" cy="-19" rx="5" ry="8" transform="rotate('+a+')" fill="none" stroke="'+c+'" stroke-width="1.1"/>'}
      return s;
    }
    function leaf(c,x,y,r){return '<g transform="translate('+x+' '+y+') rotate('+r+')"><path d="M0 0 Q9 -6 18 0 Q9 6 0 0Z" fill="none" stroke="'+c+'" stroke-width="1.1"/><path d="M0 0 L16 0" stroke="'+c+'" stroke-width=".8"/></g>'}
    function tile(c){
      return '<g transform="translate(34 34)">'+sprig(c)+'</g><g transform="translate(98 92) scale(.8)">'+sprig(c)+'</g>'+
        leaf(c,54,22,-30)+leaf(c,60,50,30)+leaf(c,10,70,-60)+leaf(c,16,96,40)+leaf(c,78,60,-20)+leaf(c,100,40,-70)+leaf(c,70,112,150)+leaf(c,112,70,100)+
        '<path d="M52 56 C62 70 70 76 80 84" fill="none" stroke="'+c+'" stroke-width="1"/>';
    }
    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><g transform="translate(1.1 1.4)" opacity=".55">'+tile('rgba(110,88,64,.55)')+'</g><g>'+tile('rgba(255,252,246,.75)')+'</g></svg>';
    document.documentElement.style.setProperty('--lace','url("data:image/svg+xml;utf8,'+encodeURIComponent(svg)+'")');
  })();

  /* ---- wax seal edge ---- */
  (function(){
    var d='',n=22;
    for(var i=0;i<=n*2;i++){
      var a=i/(n*2)*Math.PI*2, r=(i%2?50:55)+Math.sin(i*1.7)*1.2;
      d+=(i?'L':'M')+(60+Math.cos(a)*r).toFixed(1)+' '+(60+Math.sin(a)*r).toFixed(1);
    }
    var p=document.getElementById('waxEdge');p.setAttribute('d',d+'Z');p.setAttribute('stroke-linejoin','round');p.setAttribute('stroke','#c99c55');p.setAttribute('stroke-width','4');
  })();

  /* ---- florals ---- */
  var ROSE=[['#8a2432','#a53544','#6e1a27','#c4576a','#4a0f19'],['#6a1824','#852231','#561320','#a63a4b','#3a0b13'],['#a34552','#bb6270','#8a3340','#d58e98','#5a1b25']];
  var LEAF=['#4c2a2a','#5d3a33','#6e5144','#3d2224'];
  function rose(g,x,y,r,pal){
    var G=el(g,'g',{transform:'translate('+x+' '+y+') rotate('+(Math.random()*360|0)+')'});
    var i;
    for(i=0;i<7;i++){var a=i/7*6.283;el(G,'circle',{cx:Math.cos(a)*r*.58,cy:Math.sin(a)*r*.58,r:r*.52,fill:pal[0],stroke:pal[4],'stroke-width':.5})}
    for(i=0;i<5;i++){var b=i/5*6.283+.5;el(G,'circle',{cx:Math.cos(b)*r*.36,cy:Math.sin(b)*r*.36,r:r*.42,fill:pal[1],stroke:pal[4],'stroke-width':.45})}
    for(i=0;i<4;i++){var c=i/4*6.283+1;el(G,'circle',{cx:Math.cos(c)*r*.2,cy:Math.sin(c)*r*.2,r:r*.3,fill:pal[2],stroke:pal[4],'stroke-width':.4})}
    el(G,'circle',{cx:0,cy:0,r:r*.17,fill:pal[3],stroke:pal[4],'stroke-width':.4});
    el(G,'path',{d:'M0 0 q'+r*.12+' '+r*-.12+' '+r*.1+' '+r*.1+' q'+r*-.18+' '+r*.16+' '+r*-.2+' '+r*-.06,fill:'none',stroke:pal[4],'stroke-width':.4});
  }
  function blossom(g,x,y,r,col){
    var G=el(g,'g',{transform:'translate('+x+' '+y+')'});
    for(var i=0;i<5;i++){var a=i/5*6.283;el(G,'circle',{cx:Math.cos(a)*r,cy:Math.sin(a)*r,r:r*.8,fill:col,stroke:'rgba(70,20,28,.5)','stroke-width':.3})}
    el(G,'circle',{cx:0,cy:0,r:r*.45,fill:'#e8c98f'});
  }
  function leaf(g,x,y,ang,len,col){
    var G=el(g,'g',{transform:'translate('+x+' '+y+') rotate('+ang+')'});
    el(G,'path',{d:'M0 0 Q'+len*.5+' '+-len*.38+' '+len+' 0 Q'+len*.5+' '+len*.38+' 0 0Z',fill:col,stroke:'rgba(20,6,8,.5)','stroke-width':.3});
    el(G,'path',{d:'M0 0 L'+len*.9+' 0',stroke:'rgba(255,230,210,.25)','stroke-width':.35,fill:'none'});
  }
  function butterfly(g,x,y,s,rot,col){
    var B=el(g,'g',{transform:'translate('+x+' '+y+') rotate('+rot+') scale('+s+')'});
    var I=el(B,'g',{class:'bf',style:'animation-delay:'+(-Math.random()*3).toFixed(2)+'s'});
    var W=el(I,'g',{class:'w',style:'animation-delay:'+(-Math.random()).toFixed(2)+'s'});
    el(W,'path',{d:'M0 0 C-4 -9 -12 -10 -11 -3 C-10 2 -5 3 0 0Z',fill:col,stroke:'#8a6532','stroke-width':.4});
    el(W,'path',{d:'M0 0 C4 -9 12 -10 11 -3 C10 2 5 3 0 0Z',fill:col,stroke:'#8a6532','stroke-width':.4});
    el(W,'path',{d:'M0 0 C-3 4 -8 8 -6 10 C-3 10 0 5 0 0Z',fill:col,stroke:'#8a6532','stroke-width':.4});
    el(W,'path',{d:'M0 0 C3 4 8 8 6 10 C3 10 0 5 0 0Z',fill:col,stroke:'#8a6532','stroke-width':.4});
    el(I,'path',{d:'M0 -3 L0 8',stroke:'#5e4222','stroke-width':1,'stroke-linecap':'round'});
  }
  function bird(g,x,y,s){
    var G=el(g,'g',{transform:'translate('+x+' '+y+') scale('+s+')'});
    el(G,'path',{d:'M-14 8 L-26 18 L-14 14Z',fill:'#b8863f',stroke:'#7a5526','stroke-width':.5});
    el(G,'path',{d:'M-14 8 C-10 -6 6 -12 14 -6 C18 -3 18 4 12 8 C6 14 -8 16 -14 8Z',fill:'#dcb06a',stroke:'#8a6532','stroke-width':.6});
    el(G,'path',{d:'M-8 4 C-2 -4 8 -2 10 4 C4 8 -4 9 -8 4Z',fill:'#c79849',stroke:'#7a5526','stroke-width':.5});
    el(G,'circle',{cx:15,cy:-9,r:6.5,fill:'#e4bd7e',stroke:'#8a6532','stroke-width':.6});
    el(G,'path',{d:'M21 -10 L28 -7 L21 -6Z',fill:'#8a6532'});
    el(G,'circle',{cx:17,cy:-10,r:1,fill:'#3a2210'});
    el(G,'path',{d:'M4 14 L3 22 M9 13 L10 21',stroke:'#7a5526','stroke-width':1.2,'stroke-linecap':'round'});
  }
  function vine(g,gf,side,seed){
    var R=rng(seed), base=side<0?22:278, dir=side<0?1:-1, pts=[], i;
    for(i=0;i<=16;i++){var t=i/16;pts.push([base+dir*(10+Math.sin(t*8+seed)*14+Math.sin(t*19)*4)*(.6+.5*Math.sin(t*3.1+1)),10+t*580])}
    var d='M'+pts[0][0]+' '+pts[0][1];
    for(i=1;i<pts.length;i++){var m=[(pts[i-1][0]+pts[i][0])/2,(pts[i-1][1]+pts[i][1])/2];d+=' Q'+pts[i-1][0].toFixed(1)+' '+pts[i-1][1].toFixed(1)+' '+m[0].toFixed(1)+' '+m[1].toFixed(1)}
    el(g,'path',{d:d,fill:'none',stroke:'#2f1416','stroke-width':2.1,'stroke-linecap':'round'});
    for(i=0;i<pts.length;i++){
      var p=pts[i];
      for(var k=0;k<2;k++){
        var a=(k?(side<0?-40:220):(side<0?40:140))+R()*40-20, L=14+R()*12;
        leaf(g,p[0],p[1],a+(side<0?0:0),L,LEAF[(R()*LEAF.length)|0]);
        if(R()>.55)blossom(g,p[0]+dir*(8+R()*18)*(k?1:.6),p[1]+(R()-.5)*20,3+R()*2,['#d9aab0','#c98791','#e8cfc0'][(R()*3)|0]);
      }
    }
    /* thin sprigs */
    for(i=0;i<5;i++){
      var q=pts[(2+R()*12)|0], ex=q[0]+dir*(26+R()*22), ey=q[1]-12-R()*26;
      el(g,'path',{d:'M'+q[0]+' '+q[1]+' Q'+(q[0]+dir*14)+' '+(q[1]-6)+' '+ex+' '+ey,stroke:'#3c1c1c','stroke-width':.8,fill:'none'});
      for(var j=0;j<4;j++)blossom(g,ex-dir*j*5,ey+j*3.2,1.5,'#cfa8b2');
    }
    return pts;
  }
  function buildFlora(){
    var back=document.getElementById('floraBack'), front=document.getElementById('floraFront'), i;
    var Lp=vine(back,front,-1,3), Rp=vine(back,front,1,11);
    /* roses along both edges, overlapping the card */
    var spec=[[-1,.06,12],[-1,.17,10],[-1,.31,13],[-1,.47,9],[-1,.62,12],[-1,.78,13],[-1,.93,11],[1,.04,11],[1,.14,13],[1,.27,9],[1,.43,12],[1,.57,10],[1,.7,13],[1,.84,11],[1,.95,13]];
    var R=rng(41);
    spec.forEach(function(s){
      var pts=s[0]<0?Lp:Rp, idx=Math.min(pts.length-1,Math.round(s[1]*16)), p=pts[idx];
      var x=p[0]+s[0]*-1*(R()*6), y=p[1];
      rose(front,x+(s[0]<0?6:-6),y,s[2]*1.3,ROSE[(R()*3)|0]);
      if(R()>.4)leaf(front,x,y+s[2]*.8,s[0]<0?60:120,9,LEAF[1]);
    });
    /* bottom foliage */
    [[40,586],[70,592],[230,590],[262,584]].forEach(function(p,i){rose(front,p[0],p[1],11+i%2*3,ROSE[i%3]);leaf(front,p[0],p[1],i%2?210:-30,12,LEAF[0])});
    var cols=['#d1a45f','#c79a58','#dcb778'];
    [[28,70,.9,-20],[272,40,1.1,15],[14,170,.8,30],[292,150,.9,-10],[22,260,1,-25],[284,300,.9,20],[10,380,.8,10],[290,470,1,-30],[26,500,.9,25],[276,560,.8,10],[48,40,.8,10],[250,90,.8,-15],[56,540,.7,-10]].forEach(function(b,i){butterfly(front,b[0],b[1],b[2]*1.15,b[3],cols[i%3])});
    bird(front,250,398,.95);
  }
  buildFlora();

  /* ---- timeline ---- */
  var stage=document.getElementById('stage'), replay=document.getElementById('replay'), timers=[], started=false;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function at(ms,fn){timers.push(setTimeout(fn,ms))}
  function cls(c){stage.classList.add(c)}
  var lines=[].slice.call(document.querySelectorAll('#copy .rv'));
  function clear(){timers.forEach(clearTimeout);timers=[]}
  function finalState(){
    ['s-seal','s-open','s-flaps','s-sides','s-gone','s-card','s-logo','s-final'].forEach(cls);
    lines.forEach(function(l){l.classList.add('on')});
    document.getElementById('brand').classList.add('on');
    replay.classList.add('show');
  }
  function sound(){try{bgm.currentTime=0;var pr=bgm.play();if(pr&&pr.catch)pr.catch(function(){})}catch(e){}}
  var muteBtn=document.getElementById('mute');
  muteBtn.addEventListener('click',function(){bgm.muted=!bgm.muted;muteBtn.textContent=bgm.muted?'🔇':'🔊';muteBtn.setAttribute('aria-pressed',bgm.muted)});
  function play(){
    if(started)return;started=true;clear();
    sound();muteBtn.classList.add('show');
    document.getElementById('seal').setAttribute('tabindex','-1');
    if(reduce){stage.classList.add('reset');finalState();void stage.offsetWidth;stage.classList.remove('reset');return}
    cls('s-seal');
    at(500,function(){cls('s-open');cls('s-flaps')});
    at(1500,function(){cls('s-sides');cls('s-card')});
    at(3300,function(){cls('s-gone')});
    at(2300,function(){cls('s-logo')});
    at(4300,function(){document.getElementById('iNames').classList.add('on')});
    at(5300,function(){document.getElementById('iDate').classList.add('on')});
    at(7600,function(){cls('s-final')});
    lines.forEach(function(l,i){at(8600+i*750,function(){l.classList.add('on')})});
    at(8600+lines.length*750,function(){document.getElementById('brand').classList.add('on');replay.classList.add('show')});
  }
  function reset(){
    clear();started=false;bgm.pause();
    stage.classList.add('reset');
    stage.className='stage reset';
    [].slice.call(stage.querySelectorAll('.rv.on')).forEach(function(n){n.classList.remove('on')});
    replay.classList.remove('show');
    void stage.offsetWidth;
    stage.classList.remove('reset');
    document.getElementById('seal').removeAttribute('tabindex');
    at(600,function(){started=false;play()});
  }
  document.getElementById('seal').addEventListener('click',play);
  stage.addEventListener('click',function(e){if(!started&&e.target.closest('.env'))play()});
  replay.addEventListener('click',reset);
})();
</script>
